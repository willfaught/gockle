name: "Go"
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v7"
    - uses: "actions/setup-go@v7"
      with:
        go-version-file: "go.mod"
    - run: "go fix ./..."
    - run: "go fmt ./..."
    - run: "git diff --exit-code"
    - run: "go build -v ./..."
    - run: "go test -v ./..."
    - run: "go vet -v ./..."
    - run: "go tool golang.org/x/vuln/cmd/govulncheck ./..."
